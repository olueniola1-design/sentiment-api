apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentiment-api
  template:
    metadata:
      labels:
        app: sentiment-api
    spec:
      containers:
      - name: sentiment-api
        # Verified registry digest; see model_versioning_report.md before updating.
        image: olueniola1/sentiment-api@sha256:a64ec8ed3b92d5f154d9c870ffe200aea5779486ad23a7246009c3bc01c8f789
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-api-service
spec:
  type: LoadBalancer
  selector:
    app: sentiment-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
